[package]
name = "app"
version = "0.1.0"
description = "Desktop chord instrument hosting installed Surge XT (CLAP)"
authors = ["you"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

clack-host = { git = "https://github.com/prokopyl/clack", features = ["default"] }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = [
  "clack-host",
  "audio-ports",
  "note-ports",
  "gui",
  "log",
  "params",
  "timer",
  "state",
  "preset-discovery",
  "raw-window-handle_06",
] }
clack-finder = { git = "https://github.com/prokopyl/clack" }

cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
wmidi = "4"
crossbeam-channel = "0.5"

# Windows/macOS backends are cfg-gated; do not pull Linux x11-only defaults.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
